services:
  # =========================================================================
  # KAFKA STREAMING INFRASTRUCTURE
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: crypto-kafka
    hostname: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:29092,PLAINTEXT://kafka:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:29092,PLAINTEXT://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: crypto-kafka-connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:9092'
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: '/usr/share/java,/usr/share/confluent-hub-components'
      CONNECT_LOG4J_ROOT_LOGLEVEL: 'INFO'
      CONNECT_LOG4J_LOGGERS: 'org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR'
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    command: 
      - bash
      - -c
      - |
        confluent-hub install --no-prompt snowflakeinc/snowflake-kafka-connector:2.2.2
        /etc/confluent/docker/run
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-connect-init:
    image: curlimages/curl:8.7.1
    container_name: crypto-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./config/connect:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka Connect cluster to stabilize..."
        sleep 5
        echo "Registering / updating Snowflake Sink Connector..."
        curl -s -f -X PUT \
          -H "Content-Type: application/json" \
          --data @/config/snowflake_connector.json \
          http://kafka-connect:8083/connectors/snowflake-sink-connector/config || \
        curl -s -f -X POST \
          -H "Content-Type: application/json" \
          --data @/config/snowflake_connector.json \
          http://kafka-connect:8083/connectors
        echo "Connector setup completed."

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: crypto-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      kafka-connect:
        condition: service_healthy

  kafka-producer:
    image: dataengineeringprojects-airflow:latest
    container_name: crypto-kafka-producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/project
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - .:/opt/project
    working_dir: /opt/project
    command: python src/kafka/main.py

  # =========================================================================
  # AIRFLOW ORCHESTRATION INFRASTRUCTURE (LOCALEXECUTOR)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: crypto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataengineeringprojects-airflow:latest
    container_name: crypto-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate && \
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    image: dataengineeringprojects-airflow:latest
    container_name: crypto-airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      DBT_PROJECT_DIR: /opt/airflow/transform
      DBT_PROFILES_DIR: /opt/airflow/transform
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-dummy_account.region.aws}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-KAFKA_CONNECTOR_USER}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-KAFKA_CONNECTOR_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-CRYPTO_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CRYPTO_DB}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-PUBLIC}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:-}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./src/transform:/opt/airflow/transform
      - ./src:/opt/airflow/src
      - ./secrets:/secrets:ro
      - ./logs:/opt/airflow/logs
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: dataengineeringprojects-airflow:latest
    container_name: crypto-airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      DBT_PROJECT_DIR: /opt/airflow/transform
      DBT_PROFILES_DIR: /opt/airflow/transform
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-dummy_account.region.aws}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-KAFKA_CONNECTOR_USER}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-KAFKA_CONNECTOR_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-CRYPTO_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CRYPTO_DB}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-PUBLIC}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:-}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./src/transform:/opt/airflow/transform
      - ./src:/opt/airflow/src
      - ./secrets:/secrets:ro
      - ./logs:/opt/airflow/logs
    command: airflow scheduler

volumes:
  postgres-db-volume:
