version: 2

models:
  - name: dim_products
    description: "Dimension table for cryptocurrency trading products."
    columns:
      - name: product_key
        description: "Surrogate key for the product (MD5 hash)."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "The primary key and natural key of the product."
        data_tests:
          - unique
          - not_null
      - name: base_currency
        description: "The base currency being traded (e.g., BTC)."
      - name: quote_currency
        description: "The quote currency used for pricing (e.g., USD)."
      - name: is_fiat_quote
        description: "Boolean indicating if the quote currency is a fiat currency."
