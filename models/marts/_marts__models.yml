version: 2

models:
  - name: fct_crypto_trades
    description: "Fact model for crypto trades containing calculated fields like USD volume."
    columns:
      - name: trade_id
        description: "Unique identifier for the trade."
        tests:
          - unique
          - not_null
      
      - name: product_id
        description: "The cryptocurrency trading pair."
        tests:
          - not_null
          
      - name: usd_volume
        description: "The total volume of the trade in USD."
        tests:
          - not_null

unit_tests:
  - name: test_fct_crypto_trades_usd_volume_calculation
    description: "Ensure usd_volume is correctly calculated as price * size"
    model: fct_crypto_trades
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_crypto_trades')
        rows:
          - {trade_id: 1, product_id: 'BTC-USD', price: 50000.0, size: 2.0, side: 'buy', trade_time: '2024-01-01 12:00:00', ingestion_time: '2024-01-01 12:00:01'}
    expect:
      rows:
        - {trade_id: 1, usd_volume: 100000.0}
