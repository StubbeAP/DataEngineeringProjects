[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-analytics-pipeline"
version = "1.0.0"
description = "End-to-end streaming crypto trade analytics pipeline with Kafka, Snowflake, dbt, and Apache Airflow"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "confluent-kafka>=2.3.0",
    "websocket-client>=1.7.0",
    "pydantic>=2.5.3",
    "duckdb>=0.10.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "dbt-core>=1.8.0",
    "dbt-snowflake>=1.8.0",
    "astronomer-cosmos>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "venv",
    ".venv",
    "target",
    "dbt_packages",
    "crypto_trades.duckdb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
