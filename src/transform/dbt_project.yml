name: 'crypto_snowflake_pipeline'
version: '1.0.0'
config-version: 2

profile: 'crypto_snowflake'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models by Medallion architecture (1_bronze, 2_silver, 3_gold)
models:
  crypto_snowflake_pipeline:
    1_bronze:
      +materialized: view
      stg_crypto_trades:
        +materialized: view
    2_silver:
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: fail
      +unique_key: trade_id
      dim_products:
        +materialized: table
      dim_date:
        +materialized: table
      fct_crypto_trades:
        +materialized: incremental
        +on_schema_change: fail
    3_gold:
      +materialized: incremental
      hourly_crypto_summary:
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: fail
        +unique_key:
          - hourly_window
          - product_id
