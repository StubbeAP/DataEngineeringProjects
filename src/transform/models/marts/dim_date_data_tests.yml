version: 2

models:
  - name: dim_date
    description: "Calendar date dimension table."
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        description: "Primary key in YYYYMMDD integer format."
        data_type: number
        data_tests:
          - unique
          - not_null
      - name: date_actual
        description: "The actual date."
        data_type: date
        data_tests:
          - not_null
      - name: year
        description: "Calendar year integer."
        data_type: number
        data_tests:
          - not_null
      - name: month
        description: "Calendar month integer (1-12)."
        data_type: number
        data_tests:
          - not_null
      - name: month_name
        description: "Three-letter month name (e.g., Jan, Feb)."
        data_type: varchar
        data_tests:
          - not_null
      - name: day
        description: "Day of the month integer (1-31)."
        data_type: number
        data_tests:
          - not_null
      - name: day_of_week
        description: "Three-letter day name (e.g., Mon, Tue)."
        data_type: varchar
        data_tests:
          - not_null
      - name: is_weekend
        description: "Flag indicating whether the date is a weekend."
        data_type: boolean
        data_tests:
          - not_null
