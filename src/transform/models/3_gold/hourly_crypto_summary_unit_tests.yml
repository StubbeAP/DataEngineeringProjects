version: 2

unit_tests:
  - name: test_hourly_crypto_summary_aggregation
    description: >
      Ensure hourly aggregation correctly buckets trades into 1-hour windows,
      summing trade counts, crypto volume, USD volume, and averaging price per bucket.
    model: hourly_crypto_summary
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_crypto_trades')
        format: dict
        rows:
          # Window 1: 12:00 — two trades
          - trade_id:       1
            product_id:     "BTC-USD"
            price:          50000.0
            size:           1.0
            side:           "buy"
            trade_time:     "2024-01-01 12:10:00"
            ingestion_time: "2024-01-01 12:10:01"

          - trade_id:       2
            product_id:     "BTC-USD"
            price:          52000.0
            size:           2.0
            side:           "sell"
            trade_time:     "2024-01-01 12:20:00"
            ingestion_time: "2024-01-01 12:20:01"

          # Window 2: 13:00 — one trade
          - trade_id:       3
            product_id:     "BTC-USD"
            price:          60000.0
            size:           1.0
            side:           "buy"
            trade_time:     "2024-01-01 13:05:00"
            ingestion_time: "2024-01-01 13:05:01"

    expect:
      format: dict
      rows:
        # 12:00 window: 2 trades, 3.0 BTC, $154,000 USD, avg $51,000
        - hourly_window:       "2024-01-01 12:00:00"
          product_id:          "BTC-USD"
          total_trades:        2
          total_crypto_volume: 3.0
          total_usd_volume:    154000.0
          avg_price:           51000.0

        # 13:00 window: 1 trade, 1.0 BTC, $60,000 USD, avg $60,000
        - hourly_window:       "2024-01-01 13:00:00"
          product_id:          "BTC-USD"
          total_trades:        1
          total_crypto_volume: 1.0
          total_usd_volume:    60000.0
          avg_price:           60000.0
