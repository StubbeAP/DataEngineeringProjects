version: 2

# Enterprise Data Quality Suite
# Defines automated quality gates executed across Bronze, Silver, and Gold layers

quality_checks:
  - table: stg_crypto_trades
    layer: staging
    description: "Raw ingested crypto trades from Kafka landing zone"
    checks:
      - name: check_trade_id_not_null
        type: not_null
        column: trade_id
        severity: error
      - name: check_trade_id_unique
        type: unique
        column: trade_id
        severity: error
      - name: check_positive_price
        type: expression
        expression: "price > 0"
        severity: error
      - name: check_positive_size
        type: expression
        expression: "size > 0"
        severity: error
      - name: check_valid_side
        type: accepted_values
        column: side
        values: ["buy", "sell"]
        severity: warn

  - table: fct_crypto_trades
    layer: marts
    description: "Curated crypto trades fact table with surrogate keys and volume calculations"
    checks:
      - name: check_fct_trade_id_pk
        type: unique
        column: trade_id
        severity: error
      - name: check_fct_product_sk_not_null
        type: not_null
        column: product_sk
        severity: error
      - name: check_volume_calculation
        type: expression
        expression: "trade_volume >= 0"
        severity: error

  - table: hourly_crypto_summary
    layer: streaming
    description: "Hourly aggregations and window metrics"
    checks:
      - name: check_hourly_window_not_null
        type: not_null
        column: hourly_window
        severity: error
      - name: check_vwap_positive
        type: expression
        expression: "vwap > 0"
        severity: error
